body: >
  Many years later, a great disaster struck Portugal, The Great Earthquake of November 1st, 1755. This event
   destroyed almost all of the city. Tremors and fires filled the land leaving permeant marks on the city's infrastructure
   and cultural heritage. Many of this population was of African descent. 
