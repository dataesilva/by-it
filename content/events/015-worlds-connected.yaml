narration:
  pose: sad1
  text: >
    Moving further, in the Roman Empire, Pope Nicholas V, (1397-1455), granted the
    “Romanus Pontifex” in 1454 to the Portuguese crown. Or, in less fancy terms, 
    he told his explorers that they had the right to explore the African and Atlantic 
    coasts south of Cape Bojidar.