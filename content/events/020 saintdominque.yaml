body: >
  1791-1803 Marks the first black republic in history formed from a slave revolution in 
  Saint-Dominque, modern day Haiti.  This revolt was for colonial emancipation driven by
  the desire for freedom. The black Jacobins rose victoriously against slavery and colonialism
  from the French Empire. This solidified the role of freedom, along with cultural and religious
  resistance, as this revolution took place on the night of August 22nd, after the Bwa Kayiman, 
  a voodoo ceremony in which the insurrection was planned and began. This revolution echoed around 
  the world.   
narration:
  pose: pointing
  text: "This image shows masks inspired by the Bwa Kayiman voodoo ceremonies."
