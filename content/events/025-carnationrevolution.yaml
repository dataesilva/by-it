body: >
  "Themes of independence continue throughout the Carnation Revolution. This revolution 
  was instituted by African leaders who wanted to end colonial rule and sovereignty. The start 
  of this path to independence took place in Sado valley (area of the country with the greatest 
  revolution spirt and fight against labor/slave exploration) which had a strong African presence."
