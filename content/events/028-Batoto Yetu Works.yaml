title: "Batoto Yetu Portugal Works"
location: { lat: 39.228222, lng: -8.060379, zoom: 8, label: "Portugal" }
side: auto
content:
  - type: text
    variant: quote
    text: >
      Our journey through the African history of Portugal spans thousands of years,
      from ancient settlements and North African influence in the Iberian Peninsula to the
      painful era of enslavement, colonial expansion, and discrimination.
      Yet this history is also a story of strength, survival, and lasting contributions.
      African people helped shape Lisbon's culture, economy, architecture, and identity.
      They rebuilt the city after the devastating earthquake of 1755, fought for freedom
      and representation, and played an important role in Portugal's journey toward democracy.
    
narration:
  pose: jump
  text: >
    By remembering these stories and sharing them with future generations, we can build a more
    inclusive and hopeful future, one in which African history is recognized, celebrated, and
    never forgotten.