id: opportunity in the azores and madeira
date: 1475-1500s
dateLabel: "1475-1500s"
title: "Opportunity in The Azores and Madeira"
location: { lat: 36.954009, lng: -15.452178, zoom: 5, label: "The Azores and Madeira, Portugal" }
side: auto
content:
  - type: text
    variant: quote
    text: >
      Opportunities grew scarce from 1475 to 1500, and hundreds to thousands of
      families packed their bags and turned beyond the sea to Madeira, the Azores,
      and even as far as Hawaii. Leaving footprints of black Portuguese culture there.
