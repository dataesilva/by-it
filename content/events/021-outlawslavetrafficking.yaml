id: outlawslavetrafficking
date: 1836
dateLabel: "1836"
title: "Outlawing Slave Trade"
location: { lat: 39.228222, lng: -8.060379, zoom: 6, label: "Portugal" }
side: auto
content:
  - type: text
    variant: quote
    text: >
      Continuing the liberation of my people, Portugal outlawed the trafficking 
      of enslaved people and slave trade in all areas of their empire, 
      including Brazil.
narration:
  pose: sad2
  text: >
    Thirty-three years down the road, in 1869, slavery is abolished in all domains of the Portuguese 
    empire. This allows for the liberation and freedom of my people!