# Closing section shown after the last event, once the map has scrolled away.
# Placeholder text — edit freely.
conclusion:
  title: "The journey continues"
  tagline: "Batoto Yetu Portugal's Other Works"
  text: >
    Through 2018-2024 Batoto Yetu Portugal works with the city of Lisbon to create and 
    install plaques throughout the area. Thes plaques specifically are in eras 
    where Portugal was affected and influenced regarding the African culture. 
    The goals of these plaues are to inform the public what the African culture 
    when through and expired throughout Portugal history.
    Today, organizations like Batoto Yetu Portugal are helping ensure that African heritage
    is not only remembered, but celebrated. Through dance, storytelling, education, and
    cultural events, Batoto Yetu reconnects people with the rich history, traditions, and
    contributions of African communities in Portugal. What was once overlooked is now being
    shared with pride, inspiring new generations to embrace their roots and helping build a
    future where African heritage continues to thrive as an essential part of Portugal's cultural
    identity.

